name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it half-published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bird-game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bird-game/package-lock.json

      # postinstall runs copy-assets.mjs, which fetches the MediaPipe runtime and
      # downloads the pose model — neither is committed, so this is what puts
      # public/wasm and public/models in place for the build.
      - run: npm ci

      # a project page is served from /<repo>/, not from the domain root
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Pages must already be switched on for the repo, with its source set to
      # GitHub Actions (Settings > Pages). Letting this step enable it instead
      # needs rights the default token does not have on a fresh repository.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bird-game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
